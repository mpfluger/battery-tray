name: Bug report
description: Something works wrong, e.g. a wrong level or a crash.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices involved
      placeholder: Razer DeathAdder V3 HyperSpeed (receiver)
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Click Gearfuel's tray icon, choose Copy diagnostics, and paste here.
      render: text
    validations:
      required: true
