name: Bug report
description: Something works wrong, e.g. a wrong level or a crash.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Devices involved
      placeholder: Razer DeathAdder V3 HyperSpeed (receiver)
  - type: input
    id: version
    attributes:
      label: BatteryTray version
      description: Shown at the top of the tray icon's menu.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
