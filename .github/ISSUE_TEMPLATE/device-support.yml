name: Device not shown
description: A wireless device with a battery doesn't get an icon.
labels: [device support]
body:
  - type: input
    id: device
    attributes:
      label: Device
      description: Brand and model.
      placeholder: Logitech MX Master 3S
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB receiver (dongle)
        - Bluetooth
        - USB cable
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        With the device connected and awake, click Gearfuel's tray icon, choose Copy diagnostics, and paste here.
        It lists the devices Gearfuel sees and any errors, without serial numbers.
      render: text
    validations:
      required: true
  - type: dropdown
    id: settings-battery
    attributes:
      label: Does Windows show its battery level in Settings → Bluetooth & devices?
      options:
        - "Yes"
        - "No"
        - Not a Bluetooth device
