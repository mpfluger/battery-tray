name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for the release notes, and MinVer reads the version from tags

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Get version from tag
        run: Add-Content $env:GITHUB_ENV "VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))"

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: dotnet publish src/Gearfuel -c Release -r win-x64 --self-contained false -o publish

      - name: Package
        run: |
          dotnet tool restore
          # The previous release lets Velopack build a small delta update.
          dotnet vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir Releases
          Get-ChildItem Releases -Exclude 'Gearfuel-*' | Remove-Item # releases before v1.1.0 were named BatteryTray
          dotnet vpk pack --packId Gearfuel --packVersion $env:VERSION --runtime win-x64 --packDir publish --mainExe Gearfuel.exe `
            --packTitle Gearfuel --packAuthors "Mark Pfluger" --icon src/Gearfuel/Gearfuel.ico `
            --framework net10.0-x64-desktop --shortcuts StartMenuRoot --noPortable --outputDir Releases

      - name: Create GitHub release
        run: |
          dotnet vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir Releases `
            --tag $env:GITHUB_REF_NAME --releaseName "Gearfuel $env:VERSION" --publish
          # Changes go straight to main rather than through pull requests, so the notes list commit subjects.
          $previous = git describe --tags --abbrev=0 "$env:GITHUB_REF_NAME^" 2>$null
          $range = if ($previous) { "$previous..$env:GITHUB_REF_NAME" } else { $env:GITHUB_REF_NAME }
          $notes = (git log $range --no-merges --format="- %s") -join "`n"
          gh release edit $env:GITHUB_REF_NAME --notes $notes
